spring.application.name=sistema_cadena_suministro
server.port=5050
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_cadena_suministro}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS: comma separated origin patterns, e.g. APP_CORS_ALLOWED_ORIGINS=https://app.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

springdoc.swagger-ui.path=/swagger-ui.html

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
